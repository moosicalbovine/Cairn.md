name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, setup/project-foundation, feat/cairn-md-mvp]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Type-check frontend
        run: npm run typecheck
      - name: Test frontend
        run: npm test -- --run
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features
      - name: Build desktop WebDriver binary
        run: npm run tauri build -- --debug --no-bundle --config src-tauri/tauri.webdriver.conf.json
      - name: Install matching Edge WebDriver
        shell: pwsh
        run: |
          $webViewRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'
          $version = if (Test-Path $webViewRoot) {
            Get-ChildItem $webViewRoot -Directory |
              Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1 -ExpandProperty Name
          }
          if (-not $version) { throw 'Microsoft Edge WebView2 Runtime is not installed on the runner' }
          $archive = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'edgedriver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          Write-Host "WebView2 Runtime: $version"
          & (Join-Path $destination 'msedgedriver.exe') --version
          $destination >> $env:GITHUB_PATH
      - name: Test Windows desktop flows
        run: npm run test:desktop
      - name: Test forced-termination recovery
        run: npm run test:recovery
      - name: Build frontend
        run: npm run build
      - name: Build desktop application
        run: npm run tauri build
      - name: Upload unsigned NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: cairn-md-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  performance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build release application
        run: npm run tauri build
      - name: Record Windows and WebView2 environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force performance-results | Out-Null
          $webViewRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'
          $webViewVersion = if (Test-Path $webViewRoot) {
            Get-ChildItem $webViewRoot -Directory |
              Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1 -ExpandProperty Name
          } else {
            'unavailable'
          }
          if (-not $webViewVersion) { $webViewVersion = 'unavailable' }
          $storageMediaType = try {
            Get-PhysicalDisk | Select-Object -First 1 -ExpandProperty MediaType
          } catch {
            'unavailable'
          }
          @{
            windows = (Get-CimInstance Win32_OperatingSystem).Caption
            windowsVersion = (Get-CimInstance Win32_OperatingSystem).Version
            webView2Version = $webViewVersion
            storageMediaType = $storageMediaType
          } | ConvertTo-Json | Set-Content performance-results\environment.json
      - name: Measure release performance
        run: npm run perf -- "src-tauri\target\release\cairn-md.exe" --samples 20 --idle-seconds 60 --output "performance-results\release.json"
      - name: Install matching Edge WebDriver for release validation
        if: always()
        shell: pwsh
        run: |
          $webViewRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'
          $version = if (Test-Path $webViewRoot) {
            Get-ChildItem $webViewRoot -Directory |
              Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1 -ExpandProperty Name
          }
          if (-not $version) { throw 'Microsoft Edge WebView2 Runtime is not installed on the runner' }
          $archive = Join-Path $env:RUNNER_TEMP 'release-edgedriver.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'release-edgedriver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          Write-Host "WebView2 Runtime: $version"
          & (Join-Path $destination 'msedgedriver.exe') --version
          $destination >> $env:GITHUB_PATH
      - name: Validate current-user installer
        id: installer-smoke
        if: always()
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not built' }
          $expectedVersion = (Get-Content 'src-tauri\tauri.conf.json' | ConvertFrom-Json).version
          npm run release:validate -- -InstallerPath $installer.FullName -ExpectedVersion $expectedVersion
      - name: Upload raw performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-release-performance-${{ github.sha }}
          path: performance-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload validated installer
        if: steps.installer-smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cairn-md-validated-installer-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30
