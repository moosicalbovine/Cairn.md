name: Release performance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build release candidate
        run: npm run tauri build
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: cairn-release-candidate-${{ github.sha }}
          path: |
            src-tauri/target/release/cairn-md.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/nsis/**
          if-no-files-found: error
          retention-days: 3

  measure:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Download release candidate
        uses: actions/download-artifact@v4
        with:
          name: cairn-release-candidate-${{ github.sha }}
          path: release-candidate
      - name: Record Windows and WebView2 environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force performance-results | Out-Null
          $webViewRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'
          $webViewVersion = if (Test-Path $webViewRoot) {
            Get-ChildItem $webViewRoot -Directory |
              Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1 -ExpandProperty Name
          } else {
            'unavailable'
          }
          if (-not $webViewVersion) { $webViewVersion = 'unavailable' }
          $storageMediaType = try {
            Get-PhysicalDisk | Select-Object -First 1 -ExpandProperty MediaType
          } catch {
            'unavailable'
          }
          @{
            windows = (Get-CimInstance Win32_OperatingSystem).Caption
            windowsVersion = (Get-CimInstance Win32_OperatingSystem).Version
            webView2Version = $webViewVersion
            storageMediaType = $storageMediaType
          } | ConvertTo-Json | Set-Content performance-results\environment.json
      - name: Measure release performance
        run: npm run perf -- "release-candidate\cairn-md.exe" --samples 40 --idle-seconds 60 --output "performance-results\release.json"
      - name: Upload raw performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-release-performance-${{ github.sha }}
          path: performance-results/
          if-no-files-found: warn
          retention-days: 30

  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download release candidate
        uses: actions/download-artifact@v4
        with:
          name: cairn-release-candidate-${{ github.sha }}
          path: release-candidate
      - name: Download previous release installer
        id: previous-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentVersion = (Get-Content 'src-tauri\tauri.conf.json' | ConvertFrom-Json).version
          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          $release = $releases | Where-Object { $_.tagName -ne "v$currentVersion" } | Select-Object -First 1
          if ($null -eq $release -or $release.tagName -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw 'A previous semantic-versioned GitHub release is required for upgrade validation'
          }
          $previousVersion = $Matches.version
          New-Item -ItemType Directory -Force previous-release | Out-Null
          gh release download $release.tagName --pattern '*.exe' --dir previous-release
          $previousInstaller = Get-ChildItem 'previous-release\*.exe' | Select-Object -First 1
          if ($null -eq $previousInstaller) { throw "Release $($release.tagName) has no Windows installer" }
          "installer=$($previousInstaller.FullName)" >> $env:GITHUB_OUTPUT
          "version=$previousVersion" >> $env:GITHUB_OUTPUT
      - name: Validate upgrade and installed workflow
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release-candidate\bundle\nsis\*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not built' }
          $expectedVersion = (Get-Content 'src-tauri\tauri.conf.json' | ConvertFrom-Json).version
          & scripts/release/validate-installer.ps1 -InstallerPath $installer.FullName -ExpectedVersion $expectedVersion -PreviousInstallerPath '${{ steps.previous-release.outputs.installer }}' -PreviousVersion '${{ steps.previous-release.outputs.version }}'
      - name: Verify embedded WebView2 bootstrapper
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release-candidate\bundle\nsis\*.exe' | Select-Object -First 1
          & scripts/release/verify-webview2-bootstrapper.ps1 -InstallerPath $installer.FullName -GeneratedNsisRoot 'release-candidate\nsis'
      - name: Upload validated installer
        uses: actions/upload-artifact@v4
        with:
          name: cairn-md-validated-installer-${{ github.sha }}
          path: release-candidate/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
