name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Verify release identity
        shell: pwsh
        run: |
          $tauriVersion = (Get-Content 'src-tauri\tauri.conf.json' | ConvertFrom-Json).version
          $packageVersion = (Get-Content 'package.json' | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path 'src-tauri\Cargo.toml' -Pattern '^version = "(?<version>[^"]+)"$').Matches[0].Groups['version'].Value
          if ($env:GITHUB_REF_NAME -ne "v$tauriVersion") { throw "Tag $env:GITHUB_REF_NAME does not match Tauri version $tauriVersion" }
          if ($packageVersion -ne $tauriVersion -or $cargoVersion -ne $tauriVersion) { throw 'Package, Cargo, and Tauri versions do not match' }
          if (-not (Test-Path -LiteralPath "docs\releases\$env:GITHUB_REF_NAME.md")) { throw 'Release notes are missing' }
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Verify frontend
        run: |
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Verify Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-features
      - name: Build desktop WebDriver binary
        run: npm run tauri build -- --debug --no-bundle --config src-tauri/tauri.webdriver.conf.json
      - name: Install matching Edge WebDriver
        shell: pwsh
        run: |
          $webViewRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'
          $version = if (Test-Path $webViewRoot) {
            Get-ChildItem $webViewRoot -Directory |
              Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1 -ExpandProperty Name
          }
          if (-not $version) { throw 'Microsoft Edge WebView2 Runtime is not installed on the runner' }
          $archive = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'edgedriver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          & (Join-Path $destination 'msedgedriver.exe') --version
          $destination >> $env:GITHUB_PATH
      - name: Verify desktop workflows
        run: |
          npm run test:desktop
          npm run test:recovery
      - name: Build release candidate
        run: npm run tauri build
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not built' }
          $checksum = "$($installer.FullName).sha256"
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksum -Value "$hash  $($installer.Name)" -NoNewline
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: cairn-release-candidate-${{ github.sha }}
          path: |
            src-tauri/target/release/cairn-md.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
            src-tauri/target/release/nsis/**
          if-no-files-found: error
          retention-days: 3

  performance:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Download release candidate
        uses: actions/download-artifact@v4
        with:
          name: cairn-release-candidate-${{ github.sha }}
          path: release-candidate
      - name: Record release environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force performance-results | Out-Null
          $webViewRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'
          $webViewVersion = Get-ChildItem $webViewRoot -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty Name
          @{
            commit = $env:GITHUB_SHA
            windows = (Get-CimInstance Win32_OperatingSystem).Caption
            windowsVersion = (Get-CimInstance Win32_OperatingSystem).Version
            webView2Version = $webViewVersion
            cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1 -ExpandProperty Name)
            installedMemoryBytes = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
          } | ConvertTo-Json | Set-Content performance-results\environment.json
      - name: Enforce release performance contract
        run: npm run perf -- "release-candidate\cairn-md.exe" --samples 40 --idle-seconds 60 --output "performance-results\release.json"
      - name: Upload release performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-release-performance-${{ github.ref_name }}
          path: performance-results/
          if-no-files-found: warn
          retention-days: 90

  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download release candidate
        uses: actions/download-artifact@v4
        with:
          name: cairn-release-candidate-${{ github.sha }}
          path: release-candidate
      - name: Download previous release installer
        id: previous-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentVersion = (Get-Content 'src-tauri\tauri.conf.json' | ConvertFrom-Json).version
          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          $release = $releases | Where-Object { $_.tagName -ne "v$currentVersion" } | Select-Object -First 1
          if ($null -eq $release -or $release.tagName -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw 'A previous semantic-versioned GitHub release is required for upgrade validation'
          }
          $previousVersion = $Matches.version
          New-Item -ItemType Directory -Force previous-release | Out-Null
          gh release download $release.tagName --pattern '*.exe' --dir previous-release
          $previousInstaller = Get-ChildItem 'previous-release\*.exe' | Select-Object -First 1
          if ($null -eq $previousInstaller) { throw "Release $($release.tagName) has no Windows installer" }
          "installer=$($previousInstaller.FullName)" >> $env:GITHUB_OUTPUT
          "version=$previousVersion" >> $env:GITHUB_OUTPUT
      - name: Validate upgrade and installed workflow
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release-candidate\bundle\nsis\*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not built' }
          & scripts/release/validate-installer.ps1 -InstallerPath $installer.FullName -ExpectedVersion $env:GITHUB_REF_NAME.Substring(1) -PreviousInstallerPath '${{ steps.previous-release.outputs.installer }}' -PreviousVersion '${{ steps.previous-release.outputs.version }}'
      - name: Verify embedded WebView2 bootstrapper
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release-candidate\bundle\nsis\*.exe' | Select-Object -First 1
          & scripts/release/verify-webview2-bootstrapper.ps1 -InstallerPath $installer.FullName -GeneratedNsisRoot 'release-candidate\nsis'

  publish:
    needs: [build, performance, installer]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download release candidate
        uses: actions/download-artifact@v4
        with:
          name: cairn-release-candidate-${{ github.sha }}
          path: release-candidate
      - name: Download performance evidence
        uses: actions/download-artifact@v4
        with:
          name: cairn-release-performance-${{ github.ref_name }}
          path: performance-results
      - name: Retain release evidence
        uses: actions/upload-artifact@v4
        with:
          name: cairn-md-release-evidence-${{ github.ref_name }}
          path: |
            release-candidate/bundle/nsis/*.exe
            release-candidate/bundle/nsis/*.sha256
            performance-results/
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem 'release-candidate\bundle\nsis\*.exe' | Select-Object -First 1
          $checksum = Get-ChildItem 'release-candidate\bundle\nsis\*.sha256' | Select-Object -First 1
          if ($null -eq $installer -or $null -eq $checksum) { throw 'Release artifacts are incomplete' }
          gh release create $env:GITHUB_REF_NAME $installer.FullName $checksum.FullName `
            --verify-tag `
            --prerelease `
            --title "Cairn.md $env:GITHUB_REF_NAME" `
            --notes-file "docs\releases\$env:GITHUB_REF_NAME.md"
