name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Verify release identity
        shell: pwsh
        run: |
          $tauriVersion = (Get-Content 'src-tauri\tauri.conf.json' | ConvertFrom-Json).version
          $packageVersion = (Get-Content 'package.json' | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path 'src-tauri\Cargo.toml' -Pattern '^version = "(?<version>[^"]+)"$').Matches[0].Groups['version'].Value
          if ($env:GITHUB_REF_NAME -ne "v$tauriVersion") { throw "Tag $env:GITHUB_REF_NAME does not match Tauri version $tauriVersion" }
          if ($packageVersion -ne $tauriVersion -or $cargoVersion -ne $tauriVersion) { throw 'Package, Cargo, and Tauri versions do not match' }
          if (-not (Test-Path -LiteralPath "docs\releases\$env:GITHUB_REF_NAME.md")) { throw 'Release notes are missing' }
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Verify frontend
        run: |
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Verify Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-features
      - name: Build desktop WebDriver binary
        run: npm run tauri build -- --debug --no-bundle --config src-tauri/tauri.webdriver.conf.json
      - name: Install matching Edge WebDriver
        shell: pwsh
        run: |
          $webViewRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'
          $version = if (Test-Path $webViewRoot) {
            Get-ChildItem $webViewRoot -Directory |
              Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1 -ExpandProperty Name
          }
          if (-not $version) { throw 'Microsoft Edge WebView2 Runtime is not installed on the runner' }
          $archive = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'edgedriver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          & (Join-Path $destination 'msedgedriver.exe') --version
          $destination >> $env:GITHUB_PATH
      - name: Verify desktop workflows
        run: |
          npm run test:desktop
          npm run test:recovery
      - name: Build release application and installer
        run: npm run tauri build
      - name: Record release environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force performance-results | Out-Null
          $webViewRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'
          $webViewVersion = Get-ChildItem $webViewRoot -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty Name
          @{
            commit = $env:GITHUB_SHA
            windows = (Get-CimInstance Win32_OperatingSystem).Caption
            windowsVersion = (Get-CimInstance Win32_OperatingSystem).Version
            webView2Version = $webViewVersion
            cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1 -ExpandProperty Name)
            installedMemoryBytes = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
          } | ConvertTo-Json | Set-Content performance-results\environment.json
      - name: Enforce release performance contract
        run: npm run perf -- "src-tauri\target\release\cairn-md.exe" --samples 20 --idle-seconds 60 --output "performance-results\release.json"
      - name: Validate installed release workflow
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not built' }
          npm run release:validate -- -InstallerPath $installer.FullName -ExpectedVersion $env:GITHUB_REF_NAME.Substring(1)
      - name: Create SHA-256 checksum
        id: artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe' | Select-Object -First 1
          $checksum = "$($installer.FullName).sha256"
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksum -Value "$hash  $($installer.Name)" -NoNewline
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT
      - name: Retain release evidence
        uses: actions/upload-artifact@v4
        with:
          name: cairn-md-release-evidence-${{ github.ref_name }}
          path: |
            ${{ steps.artifacts.outputs.installer }}
            ${{ steps.artifacts.outputs.checksum }}
            performance-results/
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER: ${{ steps.artifacts.outputs.installer }}
          CHECKSUM: ${{ steps.artifacts.outputs.checksum }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:INSTALLER $env:CHECKSUM `
            --verify-tag `
            --prerelease `
            --title "Cairn.md $env:GITHUB_REF_NAME" `
            --notes-file "docs\releases\$env:GITHUB_REF_NAME.md"
