[package]
name = "cairn-md"
version = "0.1.0"
description = "A fast, local Markdown library for Windows"
authors = ["Cairn.md contributors"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/moosicalbovine/Cairn.md"

[lib]
name = "cairn_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
log = "=0.4.34"
notify = "=8.2.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-log = "=2.9.1"
tauri-plugin-single-instance = "=2.4.4"
uuid = { version = "=1.26.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
